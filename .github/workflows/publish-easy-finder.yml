name: Publish Easy Finder Product subtree
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Fetch Easy Finder Product site
        uses: actions/checkout@v4
        with:
          repository: shybin3862/easy-finder-product
          ref: gh-pages
          path: efp
      - name: Merge and push
        run: |
          rm -rf site/easy-finder-product
          mkdir -p site/easy-finder-product
          rsync -a --exclude .git efp/ site/easy-finder-product/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-finder-product
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Easy Finder Product"
          git push
