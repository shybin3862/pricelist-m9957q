name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir site
          cp app/index.html app/manifest.json app/sw.js site/
          for f in icon-180 icon-192 icon-512; do base64 -d app/$f.png.b64 > site/$f.png; done
          touch site/.nojekyll
          sha256sum site/*.png
      - name: Push to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Try to enable Pages from gh-pages (may need repo settings instead)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || gh api "repos/${GITHUB_REPOSITORY}/pages"
